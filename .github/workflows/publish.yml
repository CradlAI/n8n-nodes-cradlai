name: Publish Package to npmjs

on:
  workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    environment: npm

    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - run: npm ci

      # Fail before releasing if the version would not pass n8n's review
      - run: npm run lint

      - run: npm run build

      - run: npm run scan

      # Inside GitHub Actions `n8n-node release` only publishes, so run release-it as it does locally, plus publishing:
      # bump the patch version, update the changelog, commit, tag, push, create the GitHub release and publish to npm
      - run: >-
          npx release-it --ci
          --git.requireBranch=main
          --git.requireCleanWorkingDir
          --git.requireUpstream
          --git.requireCommits
          --git.commit
          --git.tag
          --git.push
          --git.changelog="npx auto-changelog --stdout --unreleased --commit-limit false -u --hide-credit"
          --github.release
          --hooks.after:bump="npx auto-changelog -p"
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          # Lets the prepublishOnly guard of n8n-node through
          RELEASE_MODE: 'true'
